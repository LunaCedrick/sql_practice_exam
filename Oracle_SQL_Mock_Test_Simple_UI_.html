<section id="start" class="screen start"><div class="panel"><h1>100 Questions</h1><p>Each take randomizes the question order and answer choices. The website covers the complete reviewer syllabus and uses single-answer and select-all-that-apply items.</p><p>Goodluck!</p><div><button class="btn primary" onclick="begin('exam')">Mock Exam</button> <button class="btn soft" onclick="begin('practice')">Practice Mode</button></div></div></section>

<script>const BANK=[{"id": 1, "topic": "Relational Concepts", "stem": "Which statement is true about a relational database?", "options": [{"id": "A", "text": "Rows are always returned in insertion order."}, {"id": "B", "text": "Logical design is independent of the physical access path."}, {"id": "C", "text": "Every foreign key must be NOT NULL."}, {"id": "D", "text": "A primary key and an index are identical."}], "correct": ["B"], "explanation": "Logical design is independent of the physical access path.", "review": "First-Half Module 1", "type": "single", "code": ""}, {"id": 2, "topic": "Relational Concepts", "stem": "Which object is primarily an optional physical access path?", "options": [{"id": "A", "text": "Primary key"}, {"id": "B", "text": "Foreign key"}, {"id": "C", "text": "Index"}, {"id": "D", "text": "Column alias"}], "correct": ["C"], "explanation": "Logical design is independent of the physical access path.", "review": "First-Half Module 1", "type": "single", "code": ""}, {"id": 3, "topic": "Relational Concepts", "stem": "Which ERD component normally maps to a table column?", "options": [{"id": "A", "text": "Entity"}, {"id": "B", "text": "Attribute"}, {"id": "C", "text": "Relationship line"}, {"id": "D", "text": "Data block"}], "correct": ["B"], "explanation": "Logical design is independent of the physical access path.", "review": "First-Half Module 1", "type": "single", "code": ""}, {"id": 4, "topic": "Relational Concepts", "stem": "Which statements are true?", "options": [{"id": "A", "text": "An entity normally maps to a table."}, {"id": "B", "text": "An attribute normally maps to a column."}, {"id": "C", "text": "ORDER BY is part of an ERD."}, {"id": "D", "text": "A relationship can be represented by a foreign key."}], "correct": ["A", "B", "D"], "explanation": "Logical design is independent of the physical access path.", "review": "First-Half Module 1", "type": "multi", "code": ""}, {"id": 5, "topic": "SELECT and Expressions", "stem": "Which statement correctly creates an alias containing a space?", "options": [{"id": "A", "text": "SELECT salary AS 'Annual Salary' FROM employees;"}, {"id": "B", "text": "SELECT salary AS \"Annual Salary\" FROM employees;"}, {"id": "C", "text": "SELECT salary = \"Annual Salary\" FROM employees;"}, {"id": "D", "text": "SELECT salary Annual Salary FROM employees;"}], "correct": ["B"], "explanation": "Aliases affect headings; DISTINCT applies to the complete result row; NULL arithmetic returns NULL.", "review": "First-Half Module 2", "type": "single", "code": ""}, {"id": 6, "topic": "SELECT and Expressions", "stem": "SELECT DISTINCT department_id, job_id removes duplicate:", "options": [{"id": "A", "text": "department_id values only"}, {"id": "B", "text": "job_id values only"}, {"id": "C", "text": "department_id and job_id combinations"}, {"id": "D", "text": "source rows before SELECT"}], "correct": ["C"], "explanation": "Aliases affect headings; DISTINCT applies to the complete result row; NULL arithmetic returns NULL.", "review": "First-Half Module 2", "type": "single", "code": ""}, {"id": 7, "topic": "SELECT and Expressions", "stem": "SALARY is 5000 and COMMISSION_PCT is NULL. What is salary + salary * commission_pct?", "options": [{"id": "A", "text": "5000"}, {"id": "B", "text": "0"}, {"id": "C", "text": "NULL"}, {"id": "D", "text": "Syntax error"}], "correct": ["C"], "explanation": "Aliases affect headings; DISTINCT applies to the complete result row; NULL arithmetic returns NULL.", "review": "First-Half Module 2", "type": "single", "code": ""}, {"id": 8, "topic": "SELECT and Expressions", "stem": "Which statements are true about aliases?", "options": [{"id": "A", "text": "They rename stored columns."}, {"id": "B", "text": "They change displayed headings."}, {"id": "C", "text": "They can normally be used in ORDER BY."}, {"id": "D", "text": "They can normally be used in same-block WHERE."}], "correct": ["B", "C"], "explanation": "Aliases affect headings; DISTINCT applies to the complete result row; NULL arithmetic returns NULL.", "review": "First-Half Module 2", "type": "multi", "code": ""}, {"id": 9, "topic": "Filtering and Sorting", "stem": "Which condition includes both 5000 and 10000?", "options": [{"id": "A", "text": "salary > 5000 AND salary < 10000"}, {"id": "B", "text": "salary BETWEEN 5000 AND 10000"}, {"id": "C", "text": "salary IN (5000,10000)"}, {"id": "D", "text": "salary >= 5000 OR salary <= 10000"}], "correct": ["B"], "explanation": "BETWEEN is inclusive; AND precedes OR; use IS NULL; DESC defaults NULLS FIRST.", "review": "First-Half Module 3", "type": "single", "code": ""}, {"id": 10, "topic": "Filtering and Sorting", "stem": "How is A OR B AND C evaluated?", "options": [{"id": "A", "text": "(A OR B) AND C"}, {"id": "B", "text": "A OR (B AND C)"}, {"id": "C", "text": "(A AND B) OR C"}, {"id": "D", "text": "Invalid without parentheses"}], "correct": ["B"], "explanation": "BETWEEN is inclusive; AND precedes OR; use IS NULL; DESC defaults NULLS FIRST.", "review": "First-Half Module 3", "type": "single", "code": ""}, {"id": 11, "topic": "Filtering and Sorting", "stem": "Which predicate correctly checks for a missing commission?", "options": [{"id": "A", "text": "commission_pct = NULL"}, {"id": "B", "text": "commission_pct IS NULL"}, {"id": "C", "text": "commission_pct = 'NULL'"}, {"id": "D", "text": "commission_pct <> NULL"}], "correct": ["B"], "explanation": "BETWEEN is inclusive; AND precedes OR; use IS NULL; DESC defaults NULLS FIRST.", "review": "First-Half Module 3", "type": "single", "code": ""}, {"id": 12, "topic": "Filtering and Sorting", "stem": "What order is returned?", "options": [{"id": "A", "text": "BEN, CARL, DINA, ANA"}, {"id": "B", "text": "CARL, DINA, ANA, BEN"}, {"id": "C", "text": "ANA, DINA, CARL, BEN"}, {"id": "D", "text": "BEN, ANA, DINA, CARL"}], "correct": ["A"], "explanation": "BETWEEN is inclusive; AND precedes OR; use IS NULL; DESC defaults NULLS FIRST.", "review": "First-Half Module 3", "type": "s out ORDER BY, a top-N business result is not deterministic."}], "correct": ["A", "B", "D"], "explanation": "&& defines and reuses a substitution variable; VERIFY shows substitution; sorting should precede top-N intent.", "review": "First-Half Module 3", "type": "multi", "code": ""}, {"id": 17, "topic": "Character Functions", "stem": "What does SUBSTR('ORACLE DATABASE',8,4) return?", "options": [{"id": "A", "text": "ORAC"}, {"id": "B", "text": "DATA"}, {"id": "C", "text": "BASE"}, {"id": "D", "text": "DATAB"}], "correct": ["B"], "explanation": "SUBSTR extracts text; INSTR returns a position; LIKE wildcards have distinct meanings.", "review": "First-Half Module 4", "type": "single", "code": ""}, {"id": 18, "topic": "Character Functions", "stem": "What does INSTR('DATABASE','A') return?", "options": [{"id": "A", "text": "The text A"}, {"id": "B", "text": "The first A position"}, {"id": "C", "text": "The string length"}, {"id": "D", "text": "Boolean TRUE"}], "correct": ["B"], "explanation": "SUBSTR extracts text; INSTR returns a position; LIKE wildcards have distinct meanings.", "review": "First-Half Module 4", "type": "single", "code": ""}, {"id": 19, "topic": "Character Functions", "stem": "Which pattern finds names whose second character is A?", "options": [{"id": "A", "text": "'A%'"}, {"id": "B", "text": "'_A%'"}, {"id": "C", "text": "'%A_'"}, {"id": "D", "text": "'%A%'"}], "correct": ["B"], "explanation": "SUBSTR extracts text; INSTR returns a position; LIKE wildcards have distinct meanings.", "review": "First-Half Module 4", "type": "single", "code": ""}, {"id": 20, "topic": "Character Functions", "stem": "Which statements are true?", "options": [{"id": "A", "text": "SUBSTR returns selected text."}, {"id": "B", "text": "INSTR returns a numeric position."}, {"id": "C", "text": "% means exactly one character."}, {"id": "D", "text": "_ means exactly one character."}], "correct": ["A", "B", "D"], "explanation": "SUBSTR extracts text; INSTR returns a position; LIKE wildcards have distinct meanings.", "review": "First-Half Module 4", "type": "multi", "code": ""}, {"id": 21, "topic": "Number and Date Functions", "stem": "Which pair is returned by ROUND(45.926,2), TRUNC(45.926,2)?", "options": [{"id": "A", "text": "45.92, 45.92"}, {"id": "B", "text": "45.93, 45.92"}, {"id": "C", "text": "45.93, 45.93"}, {"id": "D", "text": "46, 45"}], "correct": ["B"], "explanation": "ROUND rounds; TRUNC cuts; MOD returns remainder; DATE + n adds days.", "review": "First-Half Module 4", "type": "single", "code": ""}, {"id": 22, "topic": "Number and Date Functions", "stem": "What is MOD(11,4)?", "options": [{"id": "A", "text": "2"}, {"id": "B", "text": "3"}, {"id": "C", "text": "4"}, {"id": "D", "text": "7"}], "correct": ["B"], "explanation": "ROUND rounds; TRUNC cuts; MOD returns remainder; DATE + n adds days.", "review": "First-Half Module 4", "type": "single", "code": ""}, {"id": 23, "topic": "Number and Date Functions", "stem": "What does hire_date + 7 represent?", "options": [{"id": "A", "text": "Seven months later"}, {"id": "B", "text": "Seven days later"}, {"id": "C", "text": "Seven hours later"}, {"id": "D", "text": "Invalid arithmetic"}], "correct": ["B"], "explanation": "ROUND rounds; TRUNC cuts; MOD returns remainder; DATE + n adds days.", "review": "First-Half Module 4", "type": "single", "code": ""}, {"id": 24, "topic": "Number and Date Functions", "stem": "Which function moves a date six calendar months?", "options": [{"id": "A", "text": "hire_date + 180"}, {"id": "B", "text": "ADD_MONTHS(hire_date,6)"}, {"id": "C", "text": "MONTHS_BETWEEN(hire_date,6)"}, {"id": "D", "text": "MOD(hire_date,6)"}], "correct": ["B"], "explanation": "ROUND rounds; TRUNC cuts; MOD returns remainder; DATE + n adds days.", "review": "First-Half Module 4", "type": "single", "code": ""}, {"id": 25, "topic": "Conversion and Conditional", "stem": "Which comparison is least dependent on session date format?", "options": [{"id": "A", "text": "hire_date='10-SEP-2026'"}, {"id": "B", "text": "hire_date=TO_DATE('2026-09-10','YYYY-MM-DD')"}, {"id": "C", "text": "TO_CHAR(hire_date)='10-SEP-2026'"}, {"id": "D", "text": "hire_date='09/10/26'"}], "correct": ["B"], "explanation": "Explicit conversion reduces NLS dependence; COALESCE picks first non-NULL; NULLIF returns NULL when equal; CASE stops at first match.", "review": "First-Half Module 5", "type": "single", "code": ""}, {"id": 26, "topic": "Conversion and Conditional", "stem": "What does COALESCE(a,b,c,0) return?", "options": [{"id": "A", "text": "Largest value"}, {"id": "B", "text": "First non-NULL from left"}, {"id": "C", "text": "Zero always"}, {"id": "D", "text": "First NULL"}], "correct": ["B"], "explanation": "Explicit conversion reduces NLS dependence; COALESCE picks first non-NULL; NULLIF returns NULL when equal; CASE stops at first match.", "review": "First-Half Module 5", "type": "single", "code": ""}, {"id": 27, "topic": "Conversion and Conditional", "stem": "What does NULLIF(10,10) return?", "options": [{"id": "A", "text": "10"}, {"id": "B", "text": "0"}, {"id": "C", "text": "NULL"}, {"id": "D", "text": "Error"}], "correct": ["C"], "explanation": "Explicit conversion reduces NLS dependence; COALESCE picks first non-NULL; NULLIF returns NULL when equal; CASE stops at first match.", "review": "First-Half Module 5", "type": "single", "code": ""}, {"id": 28, "topic": "Conversion and Conditional", "stem": "CASE checks salary >= 5000 before salary >= 10000. What returns for 12000?", "options": [{"id": "A", "text": "First branch result"}, {"id": "B", "text": "Both results"}, {"id": "C", "text": "Overlap error"}, {"id": "D", "text": "NULL"}], "correct": ["A"], "explanation": "Explicit conversion reduces NLS dependence; COALESCE picks first non-NULL; NULLIF returns NULL when equal; CASE stops at first match.", "review": "First-Half Module 5", "type": "single", "code": ""}, {"id": 29, "topic": "Aggregation", "stem": "For 500, NULL, 700, NULL, what are COUNT(*), COUNT(value), AV
