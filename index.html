<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Oracle SQL Mock Exam</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --card: #ffffff;
      --ink: #17212f;
      --muted: #58657a;
      --line: #dfe7f1;
      --brand: #183b5b;
      --brand-2: #225a91;
      --brand-soft: #edf5ff;
      --accent: #d66a2d;
      --ok: #1d7a4f;
      --ok-soft: #eafaf0;
      --bad: #b42318;
      --bad-soft: #fdeceb;
      --warn: #8a5a00;
      --warn-soft: #fff7d6;
      --shadow: 0 18px 40px rgba(18, 41, 64, 0.12);
      --nav-h: 72px;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(34,90,145,0.08), transparent 34%),
        linear-gradient(180deg, var(--bg) 0%, #edf3fb 100%);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body { min-height: 100dvh; }

    button,
    input { font: inherit; }

    header {
      min-height: var(--nav-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 0 26px;
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
      color: #fff;
      box-shadow: 0 8px 24px rgba(24,59,91,0.2);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header b {
      font-size: clamp(1rem, 2vw, 1.45rem);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #timer {
      min-width: 100px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      font-weight: 700;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .screen {
      min-height: calc(100dvh - var(--nav-h));
      padding: 18px;
    }

    .hidden { display: none !important; }

    .panel {
      background: rgba(255,255,255,0.92);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    .start {
      display: grid;
      place-items: center;
    }

    .start .panel {
      width: min(760px, 100%);
      padding: 34px 30px 28px;
      text-align: center;
    }

    .start h1 {
      margin: 0 0 14px;
      color: var(--brand);
      font-size: clamp(2rem, 7vw, 3.2rem);
    }

    .start p {
      margin: 0 0 14px;
      color: var(--muted);
      line-height: 1.65;
    }

    .start-actions,
    .reviewer-links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .reviewer-links {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .btn,
    .download-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px 18px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(23, 33, 47, 0.04);
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--accent) 0%, #e3833f 100%);
      border-color: var(--accent);
      color: #fff;
    }

    .btn.soft {
      background: var(--brand-soft);
      border-color: #cfe3ff;
      color: var(--brand);
    }

    .btn.danger {
      background: var(--bad-soft);
      border-color: #f0c5c1;
      color: var(--bad);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .layout {
      min-height: calc(100dvh - var(--nav-h) - 36px);
      display: grid;
      grid-template-columns: minmax(0,1fr) 300px;
      gap: 16px;
    }

    .question-panel {
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0,1fr) auto;
      overflow: hidden;
    }

    .qhead {
      padding: 16px 18px 14px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(245,249,255,0.9), rgba(255,255,255,0.82));
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 6px 10px;
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .progress {
      height: 8px;
      margin-top: 14px;
      background: #edf1f6;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress i {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--accent) 0%, #f0a15d 100%);
      border-radius: inherit;
    }

    .qscroll {
      min-height: 0;
      overflow: auto;
      padding: 24px 22px 10px;
      overscroll-behavior: contain;
    }

    .stem {
      margin: 0 0 12px;
      font-size: clamp(1.08rem, 2vw, 1.45rem);
      line-height: 1.55;
      font-weight: 750;
    }

    .instruction {
      margin: 0 0 18px;
      color: var(--brand);
      font-weight: 800;
    }

    .content-section,
    .table-card,
    .code-card,
    .feedback,
    .technical-note {
      margin: 16px 0;
    }

    .content-section {
      line-height: 1.6;
      color: var(--ink);
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
    }

    .table-title,
    .code-title {
      margin: 0 0 8px;
      color: var(--brand);
      font-weight: 800;
    }

    table {
      width: 100%;
      min-width: 520px;
      border-collapse: collapse;
      font-size: 0.94rem;
    }

    th,
    td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f6f9fd;
      color: var(--brand);
    }

    pre,
    .option-code {
      white-space: pre-wrap;
      overflow-x: auto;
      overflow-wrap: anywhere;
      font-family: "Consolas", "Courier New", monospace;
    }

    pre {
      margin: 0;
      padding: 14px 16px;
      border-radius: 12px;
      background: linear-gradient(180deg, #1a2430, #0f1726);
      color: #e8f0ff;
      line-height: 1.55;
    }

    #options {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    .option {
      display: grid;
      grid-template-columns: 24px 34px minmax(0,1fr);
      gap: 10px;
      align-items: start;
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fff;
      cursor: pointer;
    }

    .option:hover,
    .option.selected {
      border-color: var(--brand-2);
      background: #f9fbff;
    }

    .option input { margin-top: 5px; }

    .option-letter {
      display: inline-grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #eef3f9;
      color: var(--brand);
      font-weight: 900;
    }

    .option.selected .option-letter {
      background: var(--brand);
      color: #fff;
    }

    .option-text {
      min-width: 0;
      line-height: 1.5;
    }

    .option-code {
      display: block;
      margin-top: 4px;
      padding: 10px;
      border-radius: 8px;
      background: #f6f8fa;
      color: #111827;
      font-size: 0.9rem;
    }

    .unavailable {
      padding: 16px;
      border-radius: 12px;
      background: var(--warn-soft);
      color: var(--warn);
      border: 1px solid #f0d47a;
      font-weight: 800;
    }

    .feedback {
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fff;
    }

    .feedback.correct {
      border-color: rgba(29,122,79,0.24);
      background: var(--ok-soft);
    }

    .feedback.incorrect {
      border-color: rgba(180,35,24,0.24);
      background: var(--bad-soft);
    }

    .feedback h3 {
      margin: 0 0 10px;
    }

    .choice-review {
      margin: 10px 0;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(255,255,255,0.75);
      border: 1px solid rgba(0,0,0,0.05);
      line-height: 1.5;
    }

    .good { color: var(--ok); font-weight: 900; }
    .bad { color: var(--bad); font-weight: 900; }

    .technical-note {
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #f0d47a;
      background: var(--warn-soft);
      color: var(--warn);
      line-height: 1.55;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px 18px;
      border-top: 1px solid var(--line);
      background: rgba(255,255,255,0.94);
    }

    .actions > div {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .side {
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0,1fr) auto;
      padding: 14px;
    }

    .side h2 {
      margin: 2px 0 12px;
      color: var(--brand);
      font-size: 1.15rem;
    }

    .nav-scroll {
      min-height: 0;
      overflow: auto;
      padding-right: 4px;
    }

    .numbers {
      display: grid;
      grid-template-columns: repeat(5, minmax(0,1fr));
      gap: 8px;
    }

    .num {
      display: grid;
      place-items: center;
      min-height: 42px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #f8fafc;
      color: var(--ink);
      cursor: pointer;
      font-weight: 800;
    }

    .num.current {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }

    .num.answered {
      background: rgba(29,122,79,0.09);
      border-color: rgba(29,122,79,0.2);
      color: var(--ok);
    }

    .num.unavailable {
      background: var(--warn-soft);
      color: var(--warn);
    }

    .num.flagged {
      box-shadow: inset 0 -4px var(--accent);
    }

    .sidefoot {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .summary {
      margin: 0 0 12px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.92rem;
    }

    .results {
      display: grid;
      place-items: start center;
      overflow: auto;
    }

    .results > .panel {
      width: min(1000px, 100%);
      padding: 26px 24px 22px;
    }

    .results h1,
    .results h2 {
      color: var(--brand);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 12px;
      margin: 18px 0;
    }

    .stat {
      padding: 16px 14px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #ffffff, #f9fbff);
      text-align: center;
    }

    .stat strong {
      display: block;
      color: var(--brand);
      font-size: clamp(1.4rem, 3vw, 2rem);
      margin-bottom: 6px;
    }

    .topic-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 14px;
      margin: 18px 0;
    }

    .topic-card {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
    }

    .topic-card h3 {
      margin: 0 0 10px;
      color: var(--brand);
      font-size: 1rem;
    }

    .topic-row {
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
    }

    .topic-row:last-child { border-bottom: 0; }

    .review-card {
      margin: 12px 0;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
    }

    .loading,
    .error {
      max-width: 780px;
      margin: 40px auto;
      padding: 18px;
      line-height: 1.6;
    }

    .error {
      border-color: rgba(180,35,24,0.28);
      background: var(--bad-soft);
      color: var(--bad);
    }

    @media (max-width: 900px) {
      .layout {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .question-panel {
        display: flex;
        flex-direction: column;
        overflow: visible;
      }

      .qscroll {
        overflow: visible;
      }

      .side {
        display: grid;
        grid-template-columns: minmax(0,1fr) auto;
        grid-template-rows: auto;
        gap: 10px;
        align-items: center;
      }

      .side h2,
      .summary {
        display: none;
      }

      .nav-scroll {
        overflow-x: auto;
        overflow-y: hidden;
        padding: 2px;
      }

      .numbers {
        display: flex;
        width: max-content;
        gap: 6px;
      }

      .num {
        width: 38px;
        min-height: 38px;
        flex: 0 0 38px;
      }

      .sidefoot {
        margin: 0;
        padding: 0;
        border: 0;
      }
    }

    @media (max-width: 640px) {
      :root { --nav-h: 64px; }

      header {
        padding: 0 max(12px, env(safe-area-inset-left)) 0 max(12px, env(safe-area-inset-right));
      }

      #timer {
        min-width: auto;
        padding: 7px 10px;
        font-size: 0.9rem;
      }

      .screen {
        padding: 10px;
      }

      .start {
        place-items: start stretch;
      }

      .start .panel,
      .results > .panel {
        padding: 22px 18px;
      }

      .start-actions,
      .reviewer-links,
      .actions,
      .actions > div {
        flex-direction: column;
        align-items: stretch;
      }

      .btn,
      .download-link {
        width: 100%;
      }

      .qscroll {
        padding: 16px 12px 10px;
      }

      .option {
        grid-template-columns: 22px 30px minmax(0,1fr);
        padding: 12px;
      }

      .actions {
        position: sticky;
        bottom: 0;
        z-index: 5;
        padding: 10px;
        padding-bottom: max(10px, env(safe-area-inset-bottom));
        background: rgba(255,255,255,0.97);
      }

      .stats,
      .topic-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <b>Oracle SQL Mock Exam</b>
    <span id="timer" aria-live="polite"></span>
  </header>

  <section id="loading" class="screen">
    <div class="panel loading">
      <strong>Loading question bank...</strong>
      <p>Reading the external JSON files from the data folder.</p>
    </div>
  </section>

  <section id="error" class="screen hidden">
    <div class="panel error">
      <strong>Question bank could not be loaded.</strong>
      <p id="errorText"></p>
    </div>
  </section>

  <section id="start" class="screen start hidden">
    <div class="panel">
      <h1 id="startTitle">Oracle SQL Reviewer</h1>
      <p id="startDetails"></p>
      <div class="start-actions">
        <button id="mockBtn" class="btn primary" type="button">Mock Exam</button>
        <button id="practiceBtn" class="btn soft" type="button">Practice Mode</button>
      </div>
      <div class="reviewer-links">
        <a class="download-link" href="./reviewers/Oracle SQL First-Half Exam Reviewer.pdf" download>Download Reviewer 1</a>
        <a class="download-link" href="./reviewers/Oracle SQL Final-Half Exam Reviewer.pdf" download>Download Reviewer 2</a>
      </div>
    </div>
  </section>

  <section id="exam" class="screen hidden">
    <div class="layout">
      <main class="panel question-panel">
        <div class="qhead">
          <div class="meta">
            <span id="qnum" class="chip"></span>
            <span id="topic" class="chip"></span>
            <span id="kind" class="chip"></span>
          </div>
          <div class="progress"><i id="bar"></i></div>
        </div>

        <div class="qscroll">
          <div id="questionBody"></div>
          <div id="options"></div>
          <div id="feedback"></div>
        </div>

        <div class="actions">
          <button id="prevBtn" class="btn" type="button">Previous</button>
          <div>
            <button id="flagBtn" class="btn soft" type="button">Flag question</button>
            <button id="nextBtn" class="btn primary" type="button">Next</button>
          </div>
        </div>
      </main>

      <aside class="panel side">
        <h2>Questions</h2>
        <div class="nav-scroll">
          <div id="numbers" class="numbers"></div>
        </div>
        <div class="sidefoot">
          <p id="summary" class="summary"></p>
          <button id="submitBtn" class="btn danger" type="button">Submit</button>
        </div>
      </aside>
    </div>
  </section>

  <section id="results" class="screen results hidden">
    <div class="panel">
      <h1>Results</h1>
      <div class="stats">
        <div class="stat"><strong id="score"></strong>Score</div>
        <div class="stat"><strong id="correct"></strong>Correct</div>
        <div class="stat"><strong id="incorrect"></strong>Incorrect</div>
        <div class="stat"><strong id="unanswered"></strong>Unanswered</div>
      </div>
      <div id="analytics"></div>
      <p class="start-actions">
        <button id="newTakeBtn" class="btn primary" type="button">New randomized take</button>
        <button id="reviewMissedBtn" class="btn soft" type="button">Review missed items</button>
        <button id="backStartBtn" class="btn" type="button">Back to start</button>
      </p>
      <div id="review"></div>
    </div>
  </section>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
